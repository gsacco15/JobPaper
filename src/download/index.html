<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Download PDF — JobPaper</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #15171B; background: #F6F3EC; }
    body { margin: 0; padding: 32px 20px; }
    main { max-width: 680px; margin: auto; }
    h1 { margin: 12px 0; font-size: 28px; }
    a { color: #1F6FEB; }
    #save { display: inline-block; margin: 12px 0; padding: 14px 24px; color: white; background: #1F6FEB; border-radius: 8px; font-weight: 600; text-decoration: none; }
    [hidden] { display: none !important; }
    p { line-height: 1.5; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <a href="/">JobPaper</a>
    <h1>Download your PDF</h1>
    <p id="status" role="status">Preparing your download…</p>
    <a id="save" hidden>Save PDF</a>
    <p id="help" hidden>Your download should start automatically. If it doesn’t, tap Save PDF. On a phone, you may need to use Share → Save to Files.</p>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
